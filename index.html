<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت کلاس و نمرات</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.8/dist/jalaali.js"></script><script src="html2canvas.min.js" defer></script><script src="js/storage.js" defer></script><script src="js/date.js" defer></script><script src="js/app.js" defer></script></head><body><main class="app"><header><div><h1>مدیریت کلاس و نمرات</h1><p id="sub">ابتدا کلاس را تشکیل دهید</p></div><div class="pill">ذخیره خودکار</div></header><section id="classes" class="page active"><div class="card"><div class="hd"><h2>کلاس‌ها</h2><span id="count" class="badge"></span></div><div class="bd"><div class="toolbar"><input id="className" placeholder="نام کلاس جدید"><button id="makeClass" class="btn primary">تشکیل کلاس</button></div><div id="classList" class="class-list"></div></div></div></section><section id="daily" class="page"><div class="card"><div class="hd"><h2>نمرات روزانه</h2><span id="dailyClass" class="badge"></span></div><div class="bd"><div class="toolbar"><div><label>تاریخ شمسی</label><input id="date" inputmode="numeric" placeholder="۱۴۰۵/۰۶/۱۶"></div><div class="mode-wrap"><label>نوع جدول</label><button id="modeBtn" class="btn ghost"></button><div id="menu" class="mode-menu"></div></div><button id="historyBtn" class="btn ghost">نمرات ثبت‌شده</button><button id="saveBtn" class="btn primary">ثبت نمرات</button><button id="pngBtn" class="btn pink">خروجی PNG</button></div><div id="info" class="info"></div><div id="history" class="history"></div><div class="quick"><input id="studentName" placeholder="نام زبان‌آموز"><button id="addStudent" class="btn primary">ثبت و افزودن بعدی</button></div><div id="students" class="grade-table-wrap"></div></div></div></section></main></body></html>
