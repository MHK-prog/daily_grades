<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سازنده جدول کلاسی</title><style>body{font-family:system-ui;margin:0;background:#f6f9ff;color:#172033}.app{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 10px 30px #1234  }.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{display:block;font-size:12px;color:#64748b;margin:5px 0}input{width:100%;padding:10px;border:1px solid #dbe4f0;border-radius:10px;box-sizing:border-box}.btn{padding:11px 15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.row{display:flex;gap:8px;align-items:end;margin-top:10px}.row input{flex:1}.table-wrap{overflow:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:center}th{background:#eff6ff}td input{border:0;border-radius:0;text-align:center}.title{text-align:center;margin-bottom:18px}</style></head><body><div class="app"><div class="card"><h2 class="title">سازنده جدول اطلاعات کلاس</h2><div class="grid"><div><label>نام کلاس</label><input id="className"></div><div><label>روز هفته</label><input id="day"></div><div><label>تاریخ شمسی</label><input id="date" placeholder="۱۴۰۵/۰۶/۱۶"></div><div><label>جلسه</label><input id="session"></div></div><div id="rows"></div><button class="btn" id="add">افزودن ردیف</button><button class="btn" id="make">ساخت جدول</button><div class="table-wrap" id="out"></div></div></div><script>const cols=['ردیف','نام و نام خانوادگی','حضور و تأخیر (۵)','تکالیف (۱۰)','مکالمه (۵)','روخوانی (۵)','گرامر (۵)','املا و انشا (۵)','انضباط (۵)','توضیحات'];let rows=[];function add(){rows.push({});let d=document.createElement('div');d.className='row';d.innerHTML='<input placeholder="نام زبان‌آموز"><button class="btn">حذف</button>';d.querySelector('input').oninput=e=>rows[rows.length-1].name=e.target.value;d.querySelector('button').onclick=()=>{d.remove();rows=rows.filter((_,i)=>i!==[...document.querySelectorAll('#rows .row')].indexOf(d))};document.getElementById('rows').append(d)}function make(){let h='<table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';for(let i=0;i<Math.max(rows.length,10);i++){let r=rows[i]||{};h+='<tr><td>'+(i+1)+'</td>'+cols.slice(1).map((_,j)=>'<td>'+(j===0?(r.name||''):'')+'</td>').join('')+'</tr>'}h+='</tbody></table>';document.getElementById('out').innerHTML='<h2>فعالیت کلاسی زبان‌آموزان</h2><p>نام کلاس: '+(className.value||'')+' | روز هفته: '+(day.value||'')+' | تاریخ: '+(date.value||'')+' | جلسه: '+(session.value||'')+'</p>'+h}document.getElementById('add').onclick=add;document.getElementById('make').onclick=make;add();</script></body></html>
