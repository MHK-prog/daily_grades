<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت کلاس و نمرات روزانه</title>
<style>
:root{--blue:#2563eb;--pink:#ec4899;--bg:#f6f9ff;--text:#172033;--muted:#64748b;--line:#dbe4f0;--shadow:0 12px 30px #1e3a8a12}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(135deg,#eff6ff,#fff1f8);color:var(--text)}.app{max-width:1100px;margin:auto;padding:18px 14px 38px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1,h2,h3,p{margin:0}.brand h1{font-size:20px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.pill,.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-left:6px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;font-size:13px}.tab{background:#fff;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.tab.active{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;border-color:transparent}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.hd{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.hd h2{font-size:16px}.bd{padding:15px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{flex:1 1 180px}.field.wide{flex-basis:100%}label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}input:focus,select:focus{outline:3px solid #2563eb22;border-color:var(--blue)}.btn{background:#eef2ff;color:#26324a}.btn.primary{background:linear-gradient(135deg,var(--blue),#38bdf8);color:#fff}.btn.pink{background:linear-gradient(135deg,var(--pink),#f973b7);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.class-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}.class-item{border:1px solid var(--line);border-radius:15px;padding:14px;background:linear-gradient(180deg,#fff,#f8fbff)}.class-item h3{font-size:15px;margin-bottom:6px}.class-item p{font-size:12px;color:var(--muted);line-height:1.8}.class-item .actions{display:flex;gap:8px;margin-top:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar .field{flex:1 1 210px}.mode-wrap{position:relative;flex:0 1 220px}.mode-menu{display:none;position:absolute;z-index:5;top:calc(100% + 6px);right:0;left:0;padding:7px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.mode-menu.open{display:block}.mode-option{display:block;width:100%;text-align:right;padding:10px;border:0;background:#fff;border-radius:9px;cursor:pointer}.mode-option:hover{background:#eff6ff}.info{padding:11px 13px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;color:#1e40af;font-size:12px;line-height:1.8;margin-top:12px}.students{display:flex;flex-direction:column;gap:9px;margin-top:14px}.student{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.student-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f8fbff}.student-head strong{font-size:14px}.total{color:#1d4ed8;font-weight:900;font-size:13px}.student-body{padding:12px}.attendance-grid{display:grid;grid-template-columns:minmax(160px,1fr) 130px 120px;gap:10px;align-items:end}.check{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-size:13px}.check input{width:20px;height:20px;accent-color:#22c55e}.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.blocked{opacity:.55}.absent-zone{margin-top:14px;padding-top:10px;border-top:1px dashed #cbd5e1}.history{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}.history-item{border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;background:#fff}.history-item.active{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb1c}.history-item strong{display:block}.history-item small{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:14px}@media(max-width:650px){header{align-items:flex-start}.pill{font-size:10px}.attendance-grid{grid-template-columns:1fr 1fr}.attendance-grid .name-field{grid-column:1/-1}}
</style></head>
<body><div class="app">
<header><div class="brand"><h1>مدیریت کلاس و نمرات روزانه</h1><p class="sub" id="headerSub">کلاس‌ها را بسازید و سپس نمرات را ثبت کنید</p></div><div class="pill"><span class="dot"></span>ذخیره خودکار</div></header>
<nav class="tabs"><button class="tab active" data-page="classes">کلاس‌ها</button><button class="tab" data-page="daily">نمرات روزانه</button></nav>
<section class="page active" id="classes"><div class="card"><div class="hd"><h2>کلاس‌ها</h2><span class="badge" id="classCount"></span></div><div class="bd"><div class="row"><div class="field"><label>نام کلاس جدید</label><input id="newClass" placeholder="مثلاً A2"></div><button class="btn primary" id="addClass">تشکیل کلاس</button></div><div id="classList" class="class-list"></div></div></div></section>
<section class="page" id="daily"><div class="card"><div class="hd"><h2>نمرات روزانه</h2><span class="badge" id="dailyClass"></span></div><div class="bd"><div class="toolbar"><div class="field"><label>تاریخ ثبت نمره</label><input id="dateInput" type="date"></div><div class="mode-wrap"><label>نوع جدول</label><button class="btn ghost" id="modeButton" style="width:100%">حضور و غیاب ▾</button><div class="mode-menu" id="modeMenu"></div></div><button class="btn ghost" id="historyButton">نمرات ثبت‌شده</button><button class="btn primary" id="saveDaily">ثبت نمرات</button></div><div class="info" id="modeInfo"></div><div id="historyPanel" style="display:none"><div class="history" id="historyList"></div></div><div id="dailyStudents" class="students"></div></div></div></section>
</div><script>
'use strict';
const KEY='class_manager_daily_v5', modes={attendance:{label:'حضور و غیاب',info:'با تیک زدن، نمره حضور کامل (۵) ثبت می‌شود. به ازای هر دو دقیقه تأخیر، یک نمره کم می‌شود.'},activity:{label:'فعالیت کلاسی',info:'نمره فعالیت کلاسی را از ۰ تا ۵ وارد کنید. زبان‌آموز غایب در انتهای جدول قرار می‌گیرد و کادر نمره‌اش غیرفعال است.'},homework:{label:'تکالیف',info:'نمره تکالیف را از ۰ تا ۱۰ وارد کنید. زبان‌آموز غایب در انتهای جدول قرار می‌گیرد و کادر نمره‌اش غیرفعال است.'},speaking:{label:'مکالمه',info:'نمره مکالمه را از ۰ تا ۵ وارد کنید. زبان‌آموز غایب در انتهای جدول قرار می‌گیرد و کادر نمره‌اش غیرفعال است.'}};
let state=load(), currentMode='attendance', currentDate=document.getElementById('dateInput').value||today();document.getElementById('dateInput').value=currentDate;
const $=id=>document.getElementById(id), selected=()=>state.classes.find(c=>c.id===state.selected)||state.classes[0];
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)} function today(){return new Date().toISOString().slice(0,10)}
function blankRecord(){return {attendance:{present:false,delay:0,score:0},scores:{activity:'',homework:'',speaking:''}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.classes?.length)return x;const old=JSON.parse(localStorage.getItem('offline_class_grades_v3')||'null');if(old?.classes?.length){const migrated={selected:old.selectedClassId||old.classes[0].id,classes:old.classes.map(c=>({id:c.id,name:c.name||'کلاس',records:{},students:(c.students||[]).map(s=>({id:s.id,name:s.fullName||'بدون نام',records:{[today()]:{attendance:{present:Number(s.scores?.attendance||0)>0,delay:0,score:Number(s.scores?.attendance||0)},scores:{activity:'',homework:s.scores?.homework??'',speaking:s.scores?.speaking??''}}}}))}))};localStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch(e){}return {selected:null,classes:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ensure(c){c.students??=[];c.records??={};c.students.forEach(s=>{s.records??={};Object.values(s.records).forEach(r=>{r.attendance??={present:false,delay:0,score:0};r.scores??={activity:'',homework:'',speaking:''}})})}
function renderClasses(){state.classes.forEach(ensure);$('classCount').textContent=state.classes.length+' کلاس';let box=$('classList');box.innerHTML='';if(!state.classes.length){box.innerHTML='<div class="empty">هنوز کلاسی تشکیل نشده است.</div>';return}state.classes.forEach(c=>{let d=document.createElement('div');d.className='class-item';d.innerHTML='<h3></h3><p></p><div class="actions"></div>';d.querySelector('h3').textContent=c.name;d.querySelector('p').textContent=(c.students?.length||0)+' زبان‌آموز';let b=document.createElement('button');b.className='btn primary';b.textContent='نمرات روزانه';b.onclick=()=>openDaily(c.id);let e=document.createElement('button');e.className='btn ghost';e.textContent='افزودن زبان‌آموز';e.onclick=()=>addStudent(c.id);d.querySelector('.actions').append(b,e);box.append(d)})}
function addStudent(cid){let c=state.classes.find(x=>x.id===cid),name=prompt('نام زبان‌آموز را وارد کنید:');if(!name?.trim())return;c.students.push({id:id(),name:name.trim(),records:{}});ensure(c);save();renderClasses();if(state.selected===cid)renderDaily()}
function openDaily(cid){state.selected=cid;save();document.querySelector('[data-page="daily"]').click();renderDaily()}
function record(s){let c=selected();c.records??={};c.records[currentDate]??={};s.records??={};s.records[currentDate]??=blankRecord();return s.records[currentDate]}
function scoreFor(s,mode){let r=record(s);if(mode==='attendance')return r.attendance.score;return r.scores[mode]}
function setScore(s,mode,val){let r=record(s);if(mode==='attendance')r.attendance.score=val;else r.scores[mode]=val}
function renderModeMenu(){let m=$('modeMenu');m.innerHTML='';Object.entries(modes).forEach(([k,v])=>{let b=document.createElement('button');b.className='mode-option';b.textContent=v.label;b.onclick=()=>{currentMode=k;$('modeMenu').classList.remove('open');renderDaily()};m.append(b)})}
function renderHistory(){let c=selected(),box=$('historyList');box.innerHTML='';let dates=new Set(Object.keys(c.records||{}));(c.students||[]).forEach(s=>Object.keys(s.records||{}).forEach(d=>dates.add(d)));[...dates].sort().reverse().forEach(d=>{let x=document.createElement('div');x.className='history-item'+(d===currentDate?' active':'');x.innerHTML='<strong></strong><small>برای ویرایش کلیک کنید</small>';x.querySelector('strong').textContent=new Date(d+'T00:00:00').toLocaleDateString('fa-IR');x.onclick=()=>{currentDate=d;$('dateInput').value=d;$('historyPanel').style.display='none';renderDaily()};box.append(x)});if(!box.children.length)box.innerHTML='<div class="empty">هنوز نمره‌ای ثبت نشده است.</div>'}
function renderDaily(){let c=selected();if(!c){$('dailyClass').textContent='کلاسی انتخاب نشده';$('dailyStudents').innerHTML='<div class="empty">ابتدا از صفحه کلاس‌ها یک کلاس تشکیل دهید.</div>';return}ensure(c);$('dailyClass').textContent=c.name;$('modeButton').textContent=modes[currentMode].label+' ▾';$('modeInfo').textContent=modes[currentMode].info;let list=[...c.students].sort((a,b)=>{let ar=record(a).attendance.present?0:1,br=record(b).attendance.present?0:1;return ar-br});$('dailyStudents').innerHTML='';if(!list.length){$('dailyStudents').innerHTML='<div class="empty">برای این کلاس زبان‌آموز اضافه کنید.</div>';return}list.forEach((s,i)=>{let r=record(s), absent=currentMode!=='attendance'&&!r.attendance.present,d=document.createElement('div');d.className='student'+(absent?' blocked':'');let h=document.createElement('div');h.className='student-head';h.innerHTML='<strong></strong><span class="total"></span>';h.querySelector('strong').textContent=(i+1)+' ـ '+s.name;h.querySelector('.total').textContent='حضور: '+r.attendance.score+' / ۵';d.append(h);let body=document.createElement('div');body.className='student-body';if(currentMode==='attendance'){let g=document.createElement('div');g.className='attendance-grid';g.innerHTML='<div class="check"><input type="checkbox"><span>حاضر است (۵ نمره)</span></div><div><label>دقیقه تأخیر</label><input class="delay" type="number" min="0" step="1" placeholder="۰"></div><div><label>نمره نهایی</label><input class="att-score" readonly></div>';let chk=g.querySelector('input'),del=g.querySelector('.delay'),sc=g.querySelector('.att-score');chk.checked=!!r.attendance.present;del.value=r.attendance.delay||'';function upd(){let n=Math.max(0,5-Math.floor((Number(del.value)||0)/2));r.attendance.present=chk.checked;r.attendance.delay=Math.max(0,Number(del.value)||0);r.attendance.score=chk.checked?n:0;sc.value=r.attendance.score;h.querySelector('.total').textContent='حضور: '+r.attendance.score+' / ۵';save()}chk.onchange=upd;del.oninput=upd;sc.value=r.attendance.score;body.append(g)}else{let g=document.createElement('div');g.className='score-grid';g.innerHTML='<div><label>'+modes[currentMode].label+' (حداکثر '+(currentMode==='homework'?10:5)+')</label><input class="score" type="number" min="0" max="'+(currentMode==='homework'?10:5)+'" step="0.25"></div>';let inp=g.querySelector('.score');inp.value=r.scores[currentMode]??'';inp.disabled=absent;inp.oninput=()=>{r.scores[currentMode]=inp.value;save()};body.append(g);if(absent){let note=document.createElement('div');note.className='absent-zone';note.textContent='غایب — کادر نمره غیرفعال است و این زبان‌آموز پایین جدول نمایش داده شده.';body.append(note)}}d.append(body);$('dailyStudents').append(d)})}
function init(){renderModeMenu();renderClasses();renderDaily();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===t.dataset.page))});$('addClass').onclick=()=>{let n=$('newClass').value.trim();if(!n)return;$('newClass').value='';let c={id:id(),name:n,students:[],records:{}};state.classes.push(c);state.selected=c.id;save();renderClasses();renderDaily()};$('modeButton').onclick=()=>$('modeMenu').classList.toggle('open');$('historyButton').onclick=()=>{let p=$('historyPanel');p.style.display=p.style.display==='none'?'block':'none';renderHistory()};$('dateInput').onchange=e=>{currentDate=e.target.value||today();renderDaily()};$('saveDaily').onclick=()=>{save();renderHistory();alert('نمرات این تاریخ ذخیره شد.')};}
init();
</script></body></html>
